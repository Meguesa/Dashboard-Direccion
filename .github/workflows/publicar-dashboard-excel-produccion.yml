
name: Publicar Dashboard Excel directo

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribe PUBLICAR_EXCEL para autorizar el despliegue'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-dashboard-direccion
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ github.event.inputs.confirmacion == 'PUBLICAR_EXCEL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Obtener integracion Excel validada
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Construir y validar paquete
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_excel_directo_build.py' -v
          test "$(find deploy-excel-directo -maxdepth 1 -type f | wc -l)" -eq 22
          php -l deploy-excel-directo/index.php
          php -l deploy-excel-directo/ingresos-historico.php
          php -l deploy-excel-directo/egresos-excel.php
          for archivo in deploy-excel-directo/*.js; do
            node --check "$archivo"
          done
          ! grep -q 'obtenerIngresosSharePoint' deploy-excel-directo/graph.js
          ! grep -q 'obtenerEgresosSharePoint' deploy-excel-directo/graph.js

      - name: Preparar conexion FTPS
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      # La cuenta de produccion del Dashboard tiene una raiz FTP limitada al sitio.
      # Nunca tratar rutas de /home/juanpab1 como accesibles desde esa cuenta.
      - name: Validar cuenta FTPS exclusiva de la carpeta privada
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PRIVATE_USERNAME: ${{ secrets.FTP_PRIVATE_USERNAME }}
          FTP_PRIVATE_PASSWORD: ${{ secrets.FTP_PRIVATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$FTP_PRIVATE_USERNAME" ] || [ -z "$FTP_PRIVATE_PASSWORD" ]; then
            echo "::error::Configura FTP_PRIVATE_USERNAME y FTP_PRIVATE_PASSWORD. La cuenta FTP privada debe tener como directorio raiz bi-ingresos-privado."
            exit 1
          fi
          test -n "$FTP_SERVER"
          php -l cpanel-preview-20261105/private-code/egresos_engine.php
          php -l cpanel-preview-20261105/private-code/ingresos_engine.php
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          # El usuario FTP nuevo DEBE iniciar dentro de bi-ingresos-privado.
          # Se verifican archivos exclusivos del motor privado ANTES de subir nada.
          lftp -u "$FTP_PRIVATE_USERNAME","$FTP_PRIVATE_PASSWORD" "ftp://${FTP_SERVER}:21" -e "
            set cmd:fail-exit yes;
            set ftp:passive-mode true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:ssl-auth TLS;
            set ssl:verify-certificate yes;
            set ssl:check-hostname yes;
            set net:timeout 30;
            set net:max-retries 1;
            get ingresos_engine.php -o $probe_dir/ingresos_engine.php;
            get egresos_engine.php -o $probe_dir/egresos_engine.php;
            get ingresos_lector_prueba.php -o $probe_dir/ingresos_lector_prueba.php;
            bye;
          "
          if ! grep -Fq "const HS_DIR='/home/juanpab1/bi-ingresos-privado';" "$probe_dir/ingresos_engine.php" ||
             ! grep -Fq 'const EG_DRIVE=' "$probe_dir/egresos_engine.php" ||
             ! grep -Fq '<?php' "$probe_dir/ingresos_lector_prueba.php"; then
            echo "::error::La cuenta FTP privada no apunta al directorio de los motores existentes. No se publican archivos."
            exit 1
          fi
          echo "Destino privado verificado sin modificar archivos."

      - name: Publicar motores en su FTP privado con respaldo
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PRIVATE_USERNAME: ${{ secrets.FTP_PRIVATE_USERNAME }}
          FTP_PRIVATE_PASSWORD: ${{ secrets.FTP_PRIVATE_PASSWORD }}
        run: |
          set -euo pipefail
          # La carpeta de inicio de esta cuenta FTPS es bi-ingresos-privado,
          # fuera de public_html. No usar nunca la cuenta de despliegue publico.
          lftp -u "$FTP_PRIVATE_USERNAME","$FTP_PRIVATE_PASSWORD" "ftp://${FTP_SERVER}:21" -e "
            set cmd:fail-exit yes;
            set ftp:passive-mode true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:ssl-auth TLS;
            set ssl:verify-certificate yes;
            set ssl:check-hostname yes;
            set net:timeout 30;
            set net:max-retries 1;
            put cpanel-preview-20261105/private-code/egresos_engine.php -o egresos_engine.php.new_${GITHUB_RUN_ID};
            put cpanel-preview-20261105/private-code/ingresos_engine.php -o ingresos_engine.php.new_${GITHUB_RUN_ID};
            mv egresos_engine.php egresos_engine.php.bak_${GITHUB_RUN_ID};
            mv egresos_engine.php.new_${GITHUB_RUN_ID} egresos_engine.php;
            mv ingresos_engine.php ingresos_engine.php.bak_${GITHUB_RUN_ID};
            mv ingresos_engine.php.new_${GITHUB_RUN_ID} ingresos_engine.php;
            bye;
          "
          echo 'Motores privados publicados; versiones anteriores conservadas como .bak_RUNID.'

      - name: Publicar en Dashboard de produccion
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

          for intento in 1 2 3; do
            if timeout --kill-after=10s 180s lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://${FTP_SERVER}:21" -e "
              set cmd:fail-exit yes;
              set ftp:passive-mode true;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ftp:ssl-auth TLS;
              set ftp:sync-mode false;
              set ssl:verify-certificate yes;
              set ssl:check-hostname yes;
              set net:timeout 30;
              set net:max-retries 1;
              mirror --reverse --overwrite --no-perms --exclude-glob index.php deploy-excel-directo .;
              put deploy-excel-directo/index.php -o index.php;
              bye;
            "; then
              echo "Publicacion FTPS completada."
              exit 0
            fi

            if [ "$intento" -lt 3 ]; then sleep 12; fi
          done

          echo "Error durante la publicacion."
          exit 1

      - name: Resumen de publicacion
        run: |
          echo "### Dashboard Excel publicado por FTPS" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://portal.juanpablo.com.mx/dashboard/" >> "$GITHUB_STEP_SUMMARY"
          echo "Verificar cifras, permisos y fuentes en el navegador." >> "$GITHUB_STEP_SUMMARY"
