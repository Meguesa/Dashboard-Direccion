name: Publicar motor Ingresos y caratula del mismo snapshot (FTPS puntual)

on:
  push:
    branches: [main]
    paths:
      - 'ops/publicar-motor-ingresos-snapshot-20261110.txt'
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribe PUBLICAR_SNAPSHOT para publicar el motor y endpoint'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-dashboard-direccion
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.confirmacion == 'PUBLICAR_SNAPSHOT') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Obtener main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,zip,dom,xml,xmlreader
          coverage: none

      - name: Verificar consistencia de ingresos y metas
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_excel_directo_build.py
          php -l deploy-excel-directo/ingresos_engine.php
          php -l deploy-excel-directo/ingresos-historico.php
          grep -q "20261110-historico-2" deploy-excel-directo/ingresos_engine.php
          grep -q "mismoSnapshotIngresos" deploy-excel-directo/ingresos-historico.php
          test -f ops/publicar-motor-ingresos-snapshot-20261110.txt

      - name: Preparar FTPS
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Preparar fuente versionada y endpoint, sin activar motor privado
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${FTP_SERVER:-}"
          test -n "${FTP_USERNAME:-}"
          test -n "${FTP_PASSWORD:-}"
          # No tocar motores activos privados: manager versionado instala
          # de forma autenticada con respaldo y comprobacion de sintaxis.
          for file in ingresos_engine.php ingresos-historico.php; do
            src="deploy-excel-directo/$file"
            verified=0
            for attempt in 1 2 3; do
              echo "FTPS $file intento $attempt"
              local_copy="$RUNNER_TEMP/verify-$file"
              rm -f "$local_copy"
              if timeout --kill-after=5s 90s lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER:21" -e "
                set cmd:fail-exit yes;
                set ftp:passive-mode true;
                set ftp:ssl-force true;
                set ftp:ssl-protect-data true;
                set ftp:ssl-auth TLS;
                set ftp:sync-mode true;
                set ssl:verify-certificate yes;
                set ssl:check-hostname yes;
                set net:timeout 18;
                set net:max-retries 2;
                put $src -o .$file.upload;
                mv .$file.upload $file;
                get $file -o $local_copy;
                bye;
              " && cmp -s "$src" "$local_copy"; then
                echo "$file verificado: $(sha256sum "$src" | cut -d' ' -f1)"
                verified=1
                break
              fi
              echo "::warning::Transferencia incompleta $file intento $attempt"
              if [ "$attempt" -lt 3 ]; then sleep 8; fi
            done
            if [ "$verified" -ne 1 ]; then
              echo "::error::No se pudo verificar $file. No continuar."
              exit 1
            fi
          done

      - name: Comprobar lectura protegida sin sesion
        shell: bash
        run: |
          set -euo pipefail
          for page in "ingresos-historico.php?modo=manifest" "actualizar-motores.php"; do
            status="$(curl -sS --max-time 18 -o /dev/null -w '%{http_code}' "https://portal.juanpablo.com.mx/dashboard/$page")"
            echo "$page HTTP $status (sin sesion)"
            case "$status" in 000|404|500|502|503) exit 1 ;; esac
          done

      - name: Resumen
        shell: bash
        run: |
          echo '### Snapshot verificado de Ingresos y metas preparado' >> "$GITHUB_STEP_SUMMARY"
          echo 'Se publicaron solamente ingresos_engine.php e ingresos-historico.php, con SHA verificado.' >> "$GITHUB_STEP_SUMMARY"
          echo 'El motor privado NO se instaló: abrir el gestor de motores y seleccionar Ingresos > Instalar versión GitHub.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No se modificaron Excel, Power Automate, cron, listas BI, ni fuentes de Egresos.' >> "$GITHUB_STEP_SUMMARY"
