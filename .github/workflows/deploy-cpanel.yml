name: Publicar Dashboard de Direccion independiente en cPanel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dashboard-direccion
  cancel-in-progress: true

jobs:
  deploy:
    name: Validar y publicar Dashboard de Direccion
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Construir paquete autonomo del Dashboard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_portal_dashboard.py
          test -s dashboard-header-map.css
          test -s dashboard-table-tools.js
          test -s dashboard-history-refresh.js
          printf '\n\n' >> deploy/styles.css
          cat dashboard-header-map.css >> deploy/styles.css
          cp dashboard-table-tools.js deploy/dashboard-table-tools.js
          cp dashboard-history-refresh.js deploy/dashboard-history-refresh.js

          python3 <<'PY'
          from pathlib import Path

          graph_path = Path('deploy/graph.js')
          graph_source = graph_path.read_text(encoding='utf-8')

          replacements = {
              'const marketing = modoCarga === "completa" ? await obtenerMarketingSharePoint() : [];':
                  'const marketing = await obtenerMarketingSharePoint();',
              'const marketingMedios = modoCarga === "completa" ? await obtenerMarketingMediosSharePoint() : [];':
                  'const marketingMedios = await obtenerMarketingMediosSharePoint();',
              'const marketingRedes = modoCarga === "completa" ? await obtenerMarketingRedesSharePoint() : [];':
                  'const marketingRedes = await obtenerMarketingRedesSharePoint();',
          }

          for old, new in replacements.items():
              if old not in graph_source:
                  raise RuntimeError(f'No se encontro el bloque esperado: {old}')
              graph_source = graph_source.replace(old, new, 1)

          graph_path.write_text(graph_source, encoding='utf-8')

          index_path = Path('deploy/index.php')
          source = index_path.read_text(encoding='utf-8')
          source = source.replace('src="graph.js?v=20260823-2"', 'src="graph.js?v=20260824-1"', 1)

          marker = '</body>'
          scripts = (
              '  <script src="dashboard-table-tools.js?v=20260824-1"></script>\n'
              '  <script src="dashboard-history-refresh.js?v=20260824-1"></script>\n'
          )

          if 'dashboard-table-tools.js' not in source or 'dashboard-history-refresh.js' not in source:
              if marker not in source:
                  raise RuntimeError('No se encontro </body> para insertar scripts auxiliares del Dashboard')
              source = source.replace(marker, scripts + marker, 1)

          index_path.write_text(source, encoding='utf-8')
          PY

      - name: Validar paquete de produccion
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy/index.php
          test -s deploy/app.js
          test -s deploy/auth.js
          test -s deploy/config.js
          test -s deploy/graph.js
          test -s deploy/styles.css
          test -s deploy/portal-integration.css
          test -s deploy/account-menu.css
          test -s deploy/dashboard-role-access.css
          test -s deploy/dashboard-role-access.js
          test -s deploy/dashboard-table-tools.js
          test -s deploy/dashboard-history-refresh.js

          php -l deploy/index.php
          grep -q 'portal_require_authentication' deploy/index.php
          grep -q 'Dashboard de Dirección' deploy/index.php
          grep -q 'https://portal.juanpablo.com.mx/dashboard/' deploy/config.js
          grep -q 'dashboard-role-access.js' deploy/index.php
          grep -q 'dashboard-table-tools.js' deploy/index.php
          grep -q 'dashboard-history-refresh.js' deploy/index.php
          grep -q 'graph.js?v=20260824-1' deploy/index.php
          grep -q 'PORTAL_USER_EMAIL' deploy/index.php
          grep -q 'Indicadores financieros, comerciales y operativos' deploy/styles.css
          grep -q 'data-dashboard-sortable' deploy/dashboard-table-tools.js
          grep -q 'Generar PDF' deploy/dashboard-table-tools.js
          grep -q 'modoCarga: "completa"' deploy/dashboard-history-refresh.js
          grep -q 'const marketing = await obtenerMarketingSharePoint();' deploy/graph.js
          grep -q 'const marketingMedios = await obtenerMarketingMediosSharePoint();' deploy/graph.js
          grep -q 'const marketingRedes = await obtenerMarketingRedesSharePoint();' deploy/graph.js

          if grep -q 'meguesa.github.io/Dashboard-Direccion' deploy/config.js; then
            echo 'ERROR: config.js conserva redirectUri de GitHub Pages.'
            exit 1
          fi

          echo 'Paquete autonomo del Dashboard validado correctamente.'

      - name: Validar credenciales de publicacion
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          echo 'Credenciales FTPS presentes.'

      - name: Instalar cliente FTPS resiliente
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Publicar Dashboard exclusivamente en su carpeta
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          files=(
            index.php
            app.js
            auth.js
            config.js
            graph.js
            styles.css
            portal-integration.css
            account-menu.css
            dashboard-role-access.css
            dashboard-role-access.js
            dashboard-table-tools.js
            dashboard-history-refresh.js
          )

          for file in "${files[@]}"; do
            test -s "deploy/$file"
          done

          for attempt in 1 2 3; do
            echo "[Dashboard] intento ${attempt} de 3 usando una sola sesion FTPS"

            if timeout --kill-after=10s 180s lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://${FTP_SERVER}:21" -e "
              set cmd:fail-exit yes;
              set ftp:passive-mode true;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ftp:ssl-auth TLS;
              set ftp:sync-mode false;
              set ssl:verify-certificate yes;
              set ssl:check-hostname yes;
              set net:timeout 30;
              set net:max-retries 1;
              lcd deploy;
              put index.php -o index.php;
              put app.js -o app.js;
              put auth.js -o auth.js;
              put config.js -o config.js;
              put graph.js -o graph.js;
              put styles.css -o styles.css;
              put portal-integration.css -o portal-integration.css;
              put account-menu.css -o account-menu.css;
              put dashboard-role-access.css -o dashboard-role-access.css;
              put dashboard-role-access.js -o dashboard-role-access.js;
              put dashboard-table-tools.js -o dashboard-table-tools.js;
              put dashboard-history-refresh.js -o dashboard-history-refresh.js;
              bye;
            "; then
              echo '[Dashboard] publicacion FTPS completada correctamente.'
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo '[Dashboard] la sesion FTPS se interrumpio. Reintentando el paquete completo en 12 segundos...'
              sleep 12
            fi
          done

          echo '[Dashboard] ERROR: no fue posible publicar el paquete completo despues de 3 intentos.'
          exit 1
