name: Publicar QA de motor Ventas Excel (sin cambiar Dashboard)

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: "Escribe PUBLICAR_AUDITORIA_VENTAS para desplegar solo dos archivos QA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-dashboard-direccion
  cancel-in-progress: false

jobs:
  publicar_auditoria_ventas:
    if: github.ref == 'refs/heads/main' && inputs.confirmacion == 'PUBLICAR_AUDITORIA_VENTAS'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: PHP y XLSX
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, xml, dom, xmlreader, mbstring, curl
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construir XLSX ficticios
        run: |
          python -m pip install openpyxl==3.1.5
          python tests/fixtures_generar_ventas.py
      - name: Probar motor QA y pantalla de auditoria
        shell: bash
        run: |
          set -euo pipefail
          php -l cpanel-preview-20261105/private-code/ventas_engine.php
          php -l cpanel-preview-20261105/dashboard-egresos-preview/ventas-excel-auditoria.php
          php tests/php/test_ventas_excel.php
          grep -Fq "produccionModificada" cpanel-preview-20261105/private-code/ventas_engine.php
          grep -Fq "biVentasReemplazada" cpanel-preview-20261105/private-code/ventas_engine.php
          grep -Fq "portal_require_authentication()" cpanel-preview-20261105/dashboard-egresos-preview/ventas-excel-auditoria.php
      - name: Instalar FTPS
        run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Publicar exclusivamente dos archivos QA
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          for name in ventas_engine.php ventas-excel-auditoria.php; do
            case "$name" in
              ventas_engine.php) src="cpanel-preview-20261105/private-code/ventas_engine.php";;
              ventas-excel-auditoria.php) src="cpanel-preview-20261105/dashboard-egresos-preview/ventas-excel-auditoria.php";;
              *) exit 1;;
            esac
            tmp="$RUNNER_TEMP/$name"
            rm -f "$tmp"
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER:21" -e "
              set cmd:fail-exit yes;
              set ftp:passive-mode true;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ftp:ssl-auth TLS;
              set ssl:verify-certificate yes;
              set ssl:check-hostname yes;
              set net:timeout 18;
              set net:max-retries 2;
              put $src -o .$name.qa-upload;
              mv .$name.qa-upload $name;
              get $name -o $tmp;
              bye;
            "
            cmp -s "$src" "$tmp" || { echo "::error::Fallo verificando $name"; exit 1; }
            echo "OK: $name"
          done
      - name: Resumen
        run: |
          echo "### Auditoría de Ventas desde Excel: solo staging" >> "$GITHUB_STEP_SUMMARY"
          echo "Publicados únicamente ventas_engine.php y ventas-excel-auditoria.php" >> "$GITHUB_STEP_SUMMARY"
          echo "No se cambio Dashboard, BI_Ventas, cron, Microsoft Graph ni Power Automate." >> "$GITHUB_STEP_SUMMARY"
          echo "Se requiere instalar el motor en carpeta privada con actualizar-motores.php." >> "$GITHUB_STEP_SUMMARY"
