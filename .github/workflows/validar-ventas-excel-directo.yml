name: Ventas Excel directo - pruebas seguras (sin publicacion)

on:
  pull_request:
    paths:
      - 'cpanel-preview-20261105/private-code/ventas_engine.php'
      - 'cpanel-preview-20261105/dashboard-egresos-preview/ventas-excel-auditoria.php'
      - 'tests/fixtures_generar_ventas.py'
      - 'tests/php/test_ventas_excel.php'
      - '.github/workflows/validar-ventas-excel-directo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas_ventas:
    name: Comprobar lector Ventas sin abrir SharePoint ni desplegar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar PHP y extensiones XLSX
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, xml, dom, xmlreader, mbstring, curl
          coverage: none
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar biblioteca de fixtures
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Analizar sintaxis PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l cpanel-preview-20261105/private-code/ventas_engine.php
          php -l cpanel-preview-20261105/dashboard-egresos-preview/ventas-excel-auditoria.php
          php -l tests/php/test_ventas_excel.php
      - name: Generar datos sinteticos (ninguna PII)
        run: python tests/fixtures_generar_ventas.py
      - name: Ejecutar casos reales del parser con XLSX sinteticos
        run: php tests/php/test_ventas_excel.php
      - name: Verificar alcance no productivo
        run: |
          grep -q "biVentasReemplazada.*false" cpanel-preview-20261105/private-code/ventas_engine.php
          grep -q "'listoParaPublicar'=\\>false" cpanel-preview-20261105/private-code/ventas_engine.php
          echo "PASS: no despliegue, sin cambios a SharePoint ni BI_Ventas"
