name: LEGADO BLOQUEADO - publicar-auth-dashboard-una-vez.yml

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    # Legado: deshabilitado. Nunca debe sobrescribir lectores Excel directos.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Lanzar despliegue independiente del Dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Publicando correccion de autenticacion Graph del Dashboard."
          gh workflow run deploy-cpanel.yml --repo Meguesa/Dashboard-Direccion --ref main
