name: Reparar gestor de motores y diagnostico de Ventas (FTPS puntual)

on:
  push:
    branches: [main]
    paths:
      - 'ops/reparar-motores-ventas-20261109.txt'
      - 'ops/diagnostico-graph-ventas-20261109.txt'
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'REPARAR_MOTORES (main) o PUBLICAR_QA_VENTAS (rama de pruebas)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-dashboard-direccion
  cancel-in-progress: false

jobs:
  reparar:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.confirmacion == 'REPARAR_MOTORES' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar version autorizada de main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Probar paquete y limites de publicacion
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_excel_directo_build.py
          php -l cpanel-preview-20261105/dashboard-egresos-preview/actualizar-motores.php
          php -l cpanel-preview-20261105/dashboard-egresos-preview/ventas-excel-preview.php
          test -f ops/reparar-motores-ventas-20261109.txt

      - name: Instalar cliente FTPS
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Publicar DOS archivos de forma secuencial y verificar bytes de servidor
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${FTP_SERVER:-}"
          test -n "${FTP_USERNAME:-}"
          test -n "${FTP_PASSWORD:-}"
          # A diferencia del mirror de 30 archivos, son dos operaciones
          # independientes, sin varias transferencias FTPS en paralelo.
          for file in ventas-excel-preview.php actualizar-motores.php; do
            src="cpanel-preview-20261105/dashboard-egresos-preview/$file"
            verified=0
            for attempt in 1 2 3; do
              echo "FTPS: $file, intento $attempt"
              local_copy="$RUNNER_TEMP/$file"
              rm -f "$local_copy"
              # Archivos ocultos de staging; .htaccess existente los bloquea.
              if timeout --kill-after=5s 85s lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER:21" -e "
                set cmd:fail-exit yes;
                set ftp:passive-mode true;
                set ftp:ssl-force true;
                set ftp:ssl-protect-data true;
                set ftp:ssl-auth TLS;
                set ftp:sync-mode true;
                set ssl:verify-certificate yes;
                set ssl:check-hostname yes;
                set net:timeout 18;
                set net:max-retries 2;
                put $src -o .$file.upload;
                mv .$file.upload $file;
                get $file -o $local_copy;
                bye;
              " && cmp -s "$src" "$local_copy"; then
                echo "Transferencia verificada: $file SHA-256 $(sha256sum "$src" | cut -d' ' -f1)"
                verified=1
                break
              fi
              echo "::warning::No se pudo verificar $file en el intento $attempt"
              if [ "$attempt" -lt 3 ]; then sleep 8; fi
            done
            if [ "$verified" -ne 1 ]; then
              echo "::error::Fallo la publicacion/verificacion de $file. No se modifica index.php."
              exit 1
            fi
          done

      - name: Comprobar que el diagnostico responde (sin asumir sesion admin)
        shell: bash
        run: |
          set -euo pipefail
          for page in ventas-excel-preview.php actualizar-motores.php; do
            status="$(curl -sS --max-time 18 -o /dev/null -w '%{http_code}' "https://portal.juanpablo.com.mx/dashboard/$page")"
            echo "$page: HTTP $status (sin autenticacion)"
            if [ "$status" = 404 ] || [ "$status" = 000 ] || [ "$status" = 500 ]; then
              echo "::error::$page no esta accesible en el servidor HTTP ($status)."
              exit 1
            fi
          done

      - name: Resumen
        run: |
          echo '### Reparacion FTPS puntual completada' >> "$GITHUB_STEP_SUMMARY"
          echo 'Solo se publicaron los PHP de diagnóstico de Ventas y gestor de motores.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ambos fueron descargados desde el servidor para verificar integridad.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No se cambio index.php, Graph, Excel, Power Automate, cron ni motores privados.' >> "$GITHUB_STEP_SUMMARY"

  publicar_ventas_qa:
    name: Publicar SOLO motor y diagnostico Ventas en modo paralelo
    # La publicacion nunca se ejecuta en push ni en main: requiere autorizacion
    # explicita y seleccion de la rama QA existente.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/ventas-excel-directo-20261112' && inputs.confirmacion == 'PUBLICAR_QA_VENTAS'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener commit QA seleccionado (no main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Preparar interpretes para la auditoria
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, xml, dom, xmlreader, mbstring, curl
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar motor, vista y libros ficticios antes de transferencia
        shell: bash
        run: |
          set -euo pipefail
          php -l cpanel-preview-20261105/private-code/ventas_engine.php
          php -l cpanel-preview-20261105/dashboard-egresos-preview/ventas-excel-preview.php
          php -l tests/php/test_ventas_excel.php
          python -m pip install --disable-pip-version-check openpyxl==3.1.5
          python tests/fixtures_generar_ventas.py "$RUNNER_TEMP/ventas-qa"
          php tests/php/test_ventas_excel.php "$RUNNER_TEMP/ventas-qa"
          grep -Fq "'biVentasReemplazada'=>false" cpanel-preview-20261105/private-code/ventas_engine.php
          grep -Fq "portal_require_authentication()" cpanel-preview-20261105/dashboard-egresos-preview/ventas-excel-preview.php

      - name: Preparar FTPS con verificacion TLS
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Enviar solamente los dos PHP de Ventas a staging y verificar hashes
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          for file in ventas_engine.php ventas-excel-preview.php; do
            if [ "$file" = ventas_engine.php ]; then
              src=cpanel-preview-20261105/private-code/ventas_engine.php
            else
              src=cpanel-preview-20261105/dashboard-egresos-preview/ventas-excel-preview.php
            fi
            local_copy="$RUNNER_TEMP/$file"
            rm -f "$local_copy"
            timeout --kill-after=5s 100s lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER:21" -e "
              set cmd:fail-exit yes;
              set ftp:passive-mode true;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ftp:ssl-auth TLS;
              set ssl:verify-certificate yes;
              set ssl:check-hostname yes;
              set net:timeout 18;
              set net:max-retries 2;
              put $src -o .$file.qa-upload;
              mv .$file.qa-upload $file;
              get $file -o $local_copy;
              bye;
            "
            cmp -s "$src" "$local_copy" || {
              echo "::error::FTPS no verifico $file. Se cancela."; exit 1;
            }
            echo "Validado: $file, SHA256 $(sha256sum "$src" | cut -d' ' -f1)"
          done

      - name: Confirmar limites de publicacion
        run: |
          echo '### QA de Ventas: transferencia puntual verificada' >> "$GITHUB_STEP_SUMMARY"
          echo 'Publicados exclusivamente ventas_engine.php (staging) y ventas-excel-preview.php (diagnostico administrador).' >> "$GITHUB_STEP_SUMMARY"
          echo 'No se instalo el motor privado, no se leyo Excel con el token de produccion y no se cambiaron KPI, index.php, app.js, graph.js, cron, Power Automate, Ingresos ni Egresos.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Instalar solo el motor Ventas desde actualizar-motores.php y ejecutar luego el diagnostico protegido.' >> "$GITHUB_STEP_SUMMARY"
