name: Publicar comparativo interanual del Dashboard

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-yoy-hotfix.yml'
      - 'auth.js'
      - 'dashboard-yoy-comparison.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dashboard-direccion
  cancel-in-progress: false

jobs:
  deploy-yoy:
    name: Publicar comparativo Ingresos, Ventas y Servicios Capillas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Construir paquete de produccion
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_portal_dashboard.py
          test -s dashboard-yoy-comparison.js
          cp dashboard-yoy-comparison.js deploy/dashboard-yoy-comparison.js
          test -s deploy/auth.js
          test -s deploy/dashboard-yoy-comparison.js
          grep -q 'dashboard-yoy-comparison.js?v=20260910-2' deploy/auth.js
          grep -q 'yoyIngresosBlock' deploy/dashboard-yoy-comparison.js
          grep -q 'yoyVentasBlock' deploy/dashboard-yoy-comparison.js
          grep -q 'yoyServiciosBlock' deploy/dashboard-yoy-comparison.js
          grep -q 'Comparativo mensual de Servicios Capillas' deploy/dashboard-yoy-comparison.js
          echo 'Comparativos mensuales validados.'

      - name: Validar credenciales FTPS
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

      - name: Instalar cliente FTPS
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Publicar solo archivos del comparativo
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "[Dashboard YoY] intento ${attempt} de 3"

            if timeout --kill-after=10s 180s lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://${FTP_SERVER}:21" -e "
              set cmd:fail-exit yes;
              set ftp:passive-mode true;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ftp:ssl-auth TLS;
              set ftp:sync-mode false;
              set ssl:verify-certificate yes;
              set ssl:check-hostname yes;
              set net:timeout 30;
              set net:max-retries 1;
              lcd deploy;
              put auth.js -o auth.js;
              put dashboard-yoy-comparison.js -o dashboard-yoy-comparison.js;
              bye;
            "; then
              echo '[Dashboard YoY] publicacion completada correctamente.'
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 12
            fi
          done

          echo '[Dashboard YoY] ERROR: no fue posible publicar el hotfix.'
          exit 1
